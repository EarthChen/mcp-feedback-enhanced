<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        :root {
            --bg-primary: #1e1e1e;
            --bg-secondary: #2d2d30;
            --surface-color: #333333;
            --text-primary: #cccccc;
            --text-secondary: #9e9e9e;
            --accent-color: #007acc;
            --accent-hover: #005a9e;
            --border-color: #464647;
            --success-color: #4caf50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .picker-container {
            width: 640px;
            max-width: 92vw;
            max-height: 86vh;
            overflow-y: auto;
            padding: 32px;
            background: var(--bg-secondary);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .picker-title {
            font-size: 1.4em;
            margin-bottom: 4px;
        }

        .picker-subtitle {
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-bottom: 24px;
        }

        .session-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .session-card {
            display: block;
            padding: 16px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.15s, transform 0.15s;
        }

        .session-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-1px);
        }

        .session-project {
            font-size: 1.05em;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 6px;
            word-break: break-all;
        }

        .session-summary {
            font-size: 0.88em;
            color: var(--text-secondary);
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .session-meta {
            display: flex;
            gap: 14px;
            font-size: 0.78em;
            color: var(--text-secondary);
        }

        .session-status {
            color: var(--success-color);
        }

        .session-id {
            font-family: monospace;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px 0;
        }
    </style>
</head>
<body>
    <div class="picker-container">
        <h1 class="picker-title">MCP Feedback</h1>
        <p class="picker-subtitle">檢測到多個活躍會話，請選擇要查看的會話</p>
        <div class="session-list" id="session-list">
            <div class="empty-state">載入中...</div>
        </div>
    </div>

    <script>
        (function() {
            const listEl = document.getElementById('session-list');

            function formatTime(ms) {
                const diff = Math.max(0, Date.now() - ms);
                const minutes = Math.floor(diff / 60000);
                if (minutes < 1) return '剛剛';
                if (minutes < 60) return minutes + ' 分鐘前';
                const hours = Math.floor(minutes / 60);
                if (hours < 24) return hours + ' 小時前';
                return Math.floor(hours / 24) + ' 天前';
            }

            function render(sessions) {
                // 只顯示仍在等待回饋的會話
                const active = sessions.filter(function(s) {
                    return !s.feedback_completed && s.status !== 'completed' && s.status !== 'timeout';
                });

                if (active.length === 0) {
                    listEl.innerHTML = '<div class="empty-state">目前沒有等待回饋的會話。<br>頁面會自動刷新，請稍候…</div>';
                    return;
                }

                listEl.innerHTML = '';
                active.forEach(function(s) {
                    const projectName = (s.project_directory || '未知專案').split(/[/\\]/).pop();
                    const summary = (s.summary || '').trim().slice(0, 120);

                    const card = document.createElement('a');
                    card.className = 'session-card';
                    card.href = '/?session=' + encodeURIComponent(s.session_id);

                    const projectEl = document.createElement('div');
                    projectEl.className = 'session-project';
                    projectEl.textContent = projectName;

                    const summaryEl = document.createElement('div');
                    summaryEl.className = 'session-summary';
                    summaryEl.textContent = summary || '（無摘要）';

                    const metaEl = document.createElement('div');
                    metaEl.className = 'session-meta';

                    const statusEl = document.createElement('span');
                    statusEl.className = 'session-status';
                    statusEl.textContent = '等待回饋中';

                    const timeEl = document.createElement('span');
                    timeEl.textContent = formatTime(s.created_at) + '建立';

                    const idEl = document.createElement('span');
                    idEl.className = 'session-id';
                    idEl.textContent = s.session_id.slice(0, 8);

                    metaEl.appendChild(statusEl);
                    metaEl.appendChild(timeEl);
                    metaEl.appendChild(idEl);
                    card.appendChild(projectEl);
                    card.appendChild(summaryEl);
                    card.appendChild(metaEl);
                    listEl.appendChild(card);
                });
            }

            function refresh() {
                fetch('/api/all-sessions')
                    .then(function(r) { return r.json(); })
                    .then(function(data) { render(data.sessions || []); })
                    .catch(function() {
                        listEl.innerHTML = '<div class="empty-state">無法取得會話列表，請確認服務是否運行。</div>';
                    });
            }

            refresh();
            setInterval(refresh, 3000);
        })();
    </script>
</body>
</html>
